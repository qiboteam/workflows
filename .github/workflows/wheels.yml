name: Wheels

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python-version:
        required: true
        type: string
      publish:
        required: false
        type: boolean
        default: false
      uv-extras:
        required: false
        type: string
        default: ""
      doctest:
        required: false
        type: boolean
        default: false
    secrets:
      PYPI-TOKEN:
        required: false

# Cancel superseded runs: a new push to the same branch/PR cancels older runs.
# Group = caller's workflow + ref (branch, or refs/pull/N/merge for PRs) +
# matrix inputs, so sibling matrix entries don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.os }}-${{ inputs.python-version }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: qiboteam/workflows/actions/uv/setup@uv
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install project
        run: uv sync ${{ inputs.uv-extras }}
      - name: Package the distribution
        run: |
          # package the pure python wheel
          uv build
      - name: Publish distribution to PyPI
        if: ${{ inputs.publish }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
