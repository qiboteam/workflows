name: Set up uv
description: |
  Instrument uv CLI.

inputs:
  python-version:
    description: "Used python version"
    required: true

runs:
  using: composite
  steps:
    - name: Setup python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Setup uv
      uses: astral-sh/setup-uv@v8.0.0
      with:
        enable-cache: true
