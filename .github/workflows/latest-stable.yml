name: Deploy Sphinx documentation

on:
  workflow_call:
    inputs:
      python-version:
        description: "Used Python version"
        required: true
        type: string
      project:
        description: "Project name"
        required: true
        type: string
      url:
        description: "Where to publish"
        required: false
        type: string
        default: https://qibo.science/
      trigger-label:
        description: "Latest or stable"
        required: false
        type: string
        default: none
      uv-extras:
        description: "uv sync extra flags"
        required: false
        type: string
        default: ""
      output-path:
        description: "docs output location"
        required: false
        type: string
        default: "doc/build/html"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  check-label:
    runs-on: ubuntu-latest
    steps:
      - name: checks for the label
        id: valid_label
        run: |
          if [[ "${{ inputs.trigger-label }}" != "latest" ]] &&
            [[ "${{ inputs.trigger-label }}" != "stable" ]]; then
            exit 1
          fi

  build:
    needs: check-label
    uses: ./.github/workflows/docs.yml
    with:
      python-version: ${{ inputs.python-version }}
      uv-extras: ${{ inputs.uv-extras }}
      output-path: ${{ inputs.output-path }}

  new-artifact:
    needs: [build, check-label]
    runs-on: ubuntu-latest
    steps:
      # Fetch the previously deployed versions from a durable, versioned
      # source (the docs-state branch) instead of the live website, which is
      # served through a CDN and may return stale content.
      - name: Checkout docs state branch (if it exists)
        id: state_checkout
        uses: actions/checkout@v6
        with:
          ref: docs-state
          fetch-depth: 0
          path: prev_docs
        continue-on-error: true
      - name: generate the ${{inputs.trigger-label}} documentation
        run: |
          label=${{inputs.trigger-label}}
          echo $label
          mkdir -v new_docs
          cd new_docs
          mkdir -v $label
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: new_docs/${{inputs.trigger-label}}
      - name: generate the remaining documentation
        run: |
          label=${{inputs.trigger-label}}
          cd new_docs
          if [[ ${label} == "latest" ]]; then
            missing_doc="stable"
          else
            missing_doc="latest"
          fi
          echo $missing_doc
          # Prefer the previous version from the durable docs-state branch.
          # The live site is CDN-cached and can serve stale content, which
          # previously caused a freshly deployed version to be rolled back.
          if [[ -f ../prev_docs/${missing_doc}.tar.gz ]]; then
            echo "Using ${missing_doc} from docs-state branch"
            tar -xvzf "../prev_docs/${missing_doc}.tar.gz"
          else
            echo "No previous ${missing_doc} found; copying current build"
            cp -va "${label}"/. "${missing_doc}"
          fi
      - name: generate the *.tar.gz
        run: |
          cd new_docs
          tar -czvf latest.tar.gz ./latest
          tar -czvf stable.tar.gz ./stable
      # TODO: use the matrix of versions we want to implement
      - name: Upload latest artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: new_docs
      # Persist the newly assembled versions so the next run can reuse them.
      - name: Push updated docs state
        continue-on-error: true
        run: |
          cd new_docs
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.tar.gz stable.tar.gz
          git commit -m "Update docs state (trigger: ${{inputs.trigger-label}})"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:docs-state

  # Deployment job
  # TODO: use the matrix of versions we want to implement
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url}}
    runs-on: ubuntu-latest
    needs: [new-artifact, check-label]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
