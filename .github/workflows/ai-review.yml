# AI code review using GitHub Copilot CLI.
#
# Reusable workflow: call it from a caller workflow triggered on the
# "labeled" pull request event, e.g.
#
#   name: ai-review
#   on:
#     pull_request:
#       types: [labeled]
#   jobs:
#     ai-review:
#       if: contains(github.event.pull_request.labels.*.name, 'run-qibot')
#       uses: qiboteam/workflows/.github/workflows/ai-review.yml@main
#       with:
#         pr-number: ${{ github.event.pull_request.number }}
#       secrets:
#         copilot_provider_base_url: ${{ secrets.COPILOT_PROVIDER_BASE_URL }}
#         copilot_provider_api_key: ${{ secrets.COPILOT_PROVIDER_API_KEY }}
#         copilot_provider_max_prompt_tokens: ${{ secrets.COPILOT_PROVIDER_MAX_PROMPT_TOKENS }}
#         copilot_provider_max_output_tokens: ${{ secrets.COPILOT_PROVIDER_MAX_OUTPUT_TOKENS }}
#         copilot_model: ${{ secrets.COPILOT_MODEL }}
#         copilot_pat: ${{ secrets.COPILOT_PAT }}
#
name: ai-review

on:
  workflow_call:
    inputs:
      pr-number:
        description: "Number of the pull request to review"
        required: true
        type: number
      provider-type:
        description: "Copilot CLI BYOK provider type"
        required: false
        type: string
        default: "openai"
      max-ai-credits:
        description: "Max AI credits per Copilot CLI invocation"
        required: false
        type: number
        default: 100
    secrets:
      copilot_provider_base_url:
        description: "Base URL of the BYOK provider"
        required: true
      copilot_provider_api_key:
        description: "API key of the BYOK provider"
        required: true
      copilot_provider_max_prompt_tokens:
        description: "Max prompt tokens for the BYOK provider"
        required: true
      copilot_provider_max_output_tokens:
        description: "Max output tokens for the BYOK provider"
        required: true
      copilot_model:
        description: "Model used by the Copilot CLI"
        required: true
      copilot_pat:
        description: "GitHub PAT used by the Copilot CLI (COPILOT_GITHUB_TOKEN)"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ inputs.pr-number }}
      MAX_AI_CREDITS: ${{ inputs.max-ai-credits }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Copilot CLI review (BYOK)
        env:
          COPILOT_PROVIDER_BASE_URL: ${{ secrets.copilot_provider_base_url }}
          COPILOT_PROVIDER_TYPE: ${{ inputs.provider-type }}
          COPILOT_PROVIDER_API_KEY: ${{ secrets.copilot_provider_api_key }}
          COPILOT_PROVIDER_MAX_PROMPT_TOKENS: ${{ secrets.copilot_provider_max_prompt_tokens }}
          COPILOT_PROVIDER_MAX_OUTPUT_TOKENS: ${{ secrets.copilot_provider_max_output_tokens }}
          COPILOT_MODEL: ${{ secrets.copilot_model }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot_pat }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Step 1: run the review. The /review command is a specialized agent
          # that outputs its findings to the conversation; it does NOT reliably
          # write files, so the file-writing is done in a separate follow-up
          # prompt below (same session, so it has the review in context).
          copilot --yolo -p "/review PR #${PR_NUMBER}" \
            --max-ai-credits "${MAX_AI_CREDITS}" \
            --share=review-session.md

      - name: Write review files (second prompt, same session)
        if: always()
        env:
          COPILOT_PROVIDER_BASE_URL: ${{ secrets.copilot_provider_base_url }}
          COPILOT_PROVIDER_TYPE: ${{ inputs.provider-type }}
          COPILOT_PROVIDER_API_KEY: ${{ secrets.copilot_provider_api_key }}
          COPILOT_PROVIDER_MAX_PROMPT_TOKENS: ${{ secrets.copilot_provider_max_prompt_tokens }}
          COPILOT_PROVIDER_MAX_OUTPUT_TOKENS: ${{ secrets.copilot_provider_max_output_tokens }}
          COPILOT_MODEL: ${{ secrets.copilot_model }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot_pat }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Step 2: in the same session, explicitly write the review findings
          # to two files, then self-verify they exist and are valid.
          copilot --yolo --continue -p "Based on the review you just performed, write your findings to two files in the current working directory using your file-writing tools (do not just print them in your reply):
          1. review-summary.md: a concise, high-level markdown summary of your findings (no per-line detail, no code snippets).
          2. review-comments.json: a JSON array of objects for feedback tied to a specific line of the diff. Each object must have:
             - path: file path exactly as it appears in the diff, relative to the repo root.
             - line: the line number in the file version implied by side (RIGHT = new file, LEFT = old file).
             - side: \"RIGHT\" for added/context lines in the new file, \"LEFT\" for removed lines in the old file.
             - body: a markdown comment explaining the issue. When you can propose a concrete fix, include a \`\`\`suggestion fenced code block with the exact replacement code for that line (or line range).
          Only include comments for lines that are actually part of the pull request diff. If there is no line-specific feedback, write an empty array [] to review-comments.json. After writing, verify both files exist and that review-comments.json is a valid JSON array; if either is missing or malformed, fix it. Do not start a new review." \
            --max-ai-credits "${MAX_AI_CREDITS}" \
            --share=review-session-verify.md

      - name: Verify review files were created
        if: always()
        run: |
          missing=0
          for f in review-summary.md review-comments.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected file '$f' was not created by the review step."
              missing=1
            fi
          done
          if [ -f review-comments.json ]; then
            if ! python3 -c "import json,sys; d=json.load(open('review-comments.json')); sys.exit(0 if isinstance(d, list) else 1)"; then
              echo "ERROR: review-comments.json is not a valid JSON array."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "The Copilot CLI did not produce valid review files. Check the review step logs."
            exit 1
          fi
          echo "Both review files are present and valid."

      - name: Fetch post-review script
        uses: actions/checkout@v4
        with:
          repository: qiboteam/workflows
          ref: main
          path: .qiboteam-workflows
          fetch-depth: 1

      - name: Post review comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .qiboteam-workflows/scripts/post_review.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-output
          path: |
            review-summary.md
            review-comments.json
            review-session.md
            review-session-verify.md
          if-no-files-found: ignore
